<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자금일보 대시보드</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --s1: #2a78d6; --s2: #eb6834; --seq: #cde2fb;
    --good: #006300; --bad: #d03b3b; --chip: #eeede8;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
      --s1: #3987e5; --s2: #d95926; --seq: #184f95;
      --good: #0ca30c; --bad: #ec835a; --chip: #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --s1: #3987e5; --s2: #d95926; --seq: #184f95;
    --good: #0ca30c; --bad: #ec835a; --chip: #262624;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .sub { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
  .picker { display: flex; gap: 6px; align-items: center; }
  .picker button, .picker select { font: inherit; color: var(--ink); background: var(--surface);
         border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .picker button:disabled { opacity: .35; cursor: default; }
  .picker button:hover:not(:disabled), .picker select:hover { background: var(--chip); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 2px; font-weight: 650; }
  .card .note { color: var(--ink-2); font-size: 12px; margin: 0 0 10px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi .lab { color: var(--ink-2); font-size: 12px; }
  .kpi .val { font-size: 24px; font-weight: 650; margin: 2px 0; letter-spacing: -.01em; }
  .kpi .val small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
  .kpi .meta { color: var(--ink-2); font-size: 12px; }
  .chip { display: inline-flex; gap: 6px; align-items: center; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 500; font-size: 12px; }
  th:first-child, td:first-child, td.l, th.l { text-align: left; }
  td.num { font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 650; border-bottom: 0; }
  .scroll { overflow-x: auto; }
  .tag { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--axis); color: var(--ink-2); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--axis);
         border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.14);
         opacity: 0; transition: opacity .08s; z-index: 5; min-width: 150px; }
  .tip b { display: block; margin-bottom: 4px; }
  .tip div { display: flex; justify-content: space-between; gap: 14px; }
  .tip span.k { color: var(--ink-2); }
  details.checks summary { cursor: pointer; list-style: none; display: inline-flex; gap: 8px; align-items: center; }
  details.checks summary::-webkit-details-marker { display: none; }
  details.checks ul { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12px; }
  details.checks li { padding: 4px 0; border-bottom: 1px solid var(--grid); display: flex; gap: 10px; }
  details.checks li .st { width: 40px; font-weight: 650; }
  .pass { color: var(--good); } .fail { color: var(--bad); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .empty { color: var(--muted); padding: 12px 0; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; }
  .stale { padding: 10px 16px; border-color: var(--bad); font-size: 13px; }
  .stale[hidden] { display: none; }
  .kpi, .two > .card { min-width: 0; }
  @media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; } }
  @media (max-width: 520px) { .kpis { grid-template-columns: 1fr; } }
  @media (forced-colors: active) { .card, .kpi { border-color: CanvasText; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span id="company"></span> 자금일보</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="picker">
      <button id="prev" aria-label="이전 거래일">◀</button>
      <select id="dateSel" aria-label="기준일"></select>
      <button id="next" aria-label="다음 거래일">▶</button>
      <button id="latest">최신일</button>
    </div>
  </header>

  <div class="card stale" id="stale" hidden></div>

  <div class="card" style="padding:10px 16px">
    <details class="checks" id="checks"></details>
  </div>

  <section class="kpis" id="kpis"></section>

  <div class="card">
    <h2>계좌별 자금일보</h2>
    <p class="note">단위: 원 · 자금일보 양식과 같은 구성 (월누계는 해당 월 1일부터)</p>
    <div class="scroll"><table id="report"></table></div>
  </div>

  <div class="two">
    <div class="card">
      <h2>회사 전체 실제 입출금</h2>
      <p class="note">계좌 합계에서 계좌간이체를 뺀 금액 (단위: 원)</p>
      <div class="scroll"><table id="real"></table></div>
      <div id="xferList" style="margin-top:10px;font-size:12px;color:var(--ink-2)"></div>
    </div>
    <div class="card">
      <h2>최근 거래일별 합계 잔액</h2>
      <p class="note">클릭하면 그날로 이동 · 단위: 백만원</p>
      <div class="chart" id="balChart"></div>
    </div>
  </div>

  <div class="card">
    <h2>일별 실제 입금·출금</h2>
    <p class="note">계좌간이체 제외 · 단위: 백만원 · 막대를 클릭하면 그날로 이동</p>
    <div class="legend"><span><i style="background:var(--s1)"></i>실제 입금</span><span><i style="background:var(--s2)"></i>실제 출금</span></div>
    <div class="chart" id="flowChart"></div>
  </div>

  <div class="card">
    <h2>입출금 내역 <span id="txnDate" style="font-weight:400;color:var(--ink-2)"></span></h2>
    <div class="scroll"><table id="txns"></table></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const D = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const fmtM = n => (n / 1e6).toLocaleString('ko-KR', { maximumFractionDigits: 0 });
const WD = ['일','월','화','수','목','금','토'];
const label = d => { const [y,m,dd] = d.split('-').map(Number); return `${d} (${WD[new Date(y, m-1, dd).getDay()]})`; };
const short = d => { const [,m,dd] = d.split('-').map(Number); return `${m}/${dd}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let cur = D.days.length - 1;               // 기본: 가장 최근 거래일
const day = () => D.days[cur];

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); const f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for (let v = a; v <= b + step / 2; v += step) t.push(v);
  return t;
}

/* ───── 헤더·검산 ───── */
function renderHead() {
  $('company').textContent = D.company;
  $('sub').textContent = `기준일 ${label(day().date)} · 데이터 ${D.days[0].date} ~ ${D.asOf} · 갱신 ${D.builtAt}`;
  const sel = $('dateSel');
  if (!sel.options.length) D.days.forEach((d, i) => sel.add(new Option(label(d.date), i)));
  sel.value = cur;
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === D.days.length - 1;
  $('latest').disabled = cur === D.days.length - 1;
}
function renderChecks() {
  const ok = D.checks.filter(c => c.ok).length, all = D.checks.length, pass = ok === all;
  $('checks').innerHTML =
    `<summary><span class="chip"><b class="${pass ? 'pass' : 'fail'}">${pass ? '✓ PASS' : '✕ FAIL'}</b> 검산 ${ok}/${all}</span>
       <span style="color:var(--ink-2);font-size:12px">${pass ? '잔액 연속성·이체 짝·월말 대사 모두 일치' : '불일치 항목이 있습니다 — 펼쳐서 확인'} (클릭해 상세 보기)</span></summary>
     <ul>${D.checks.map(c => `<li><span class="st ${c.ok ? 'pass' : 'fail'}">${c.ok ? '✓ PASS' : '✕ FAIL'}</span><span>${esc(c.label)}<br><span style="color:var(--ink-2)">${esc(c.detail)}</span></span></li>`).join('')}</ul>`;
}

/* ───── KPI ───── */
function renderKpis() {
  const d = day(), diff = d.totalClose - d.totalOpen, net = d.realIn - d.realOut;
  const sign = n => (n > 0 ? '▲ +' : n < 0 ? '▼ −' : '– ') + fmt(Math.abs(n));
  const tiles = [
    ['합계 잔액 (금일)', fmt(d.totalClose), `전일 대비 ${sign(diff)}원`],
    ['실제 입금', fmt(d.realIn), `계좌 입금 ${fmt(d.realIn + d.xfer)} − 이체 ${fmt(d.xfer)}`],
    ['실제 출금', fmt(d.realOut), `계좌 출금 ${fmt(d.realOut + d.xfer)} − 이체 ${fmt(d.xfer)}`],
    ['실제 순입출금', (net < 0 ? '−' : net > 0 ? '+' : '') + fmt(Math.abs(net)), '실제 입금 − 실제 출금'],
  ];
  $('kpis').innerHTML = tiles.map(([l, v, m]) => `<div class="kpi"><div class="lab">${l}</div><div class="val">${v}<small>원</small></div><div class="meta">${m}</div></div>`).join('');
}

/* ───── 표 ───── */
function renderTables() {
  const d = day(), A = D.accounts;
  const sum = k => A.reduce((s, a) => s + d.accts[a][k], 0);
  const row = (name, k) => `<tr class="${name === '합계' ? 'total' : ''}"><td>${name}</td>` +
    ['open','inn','out','close','mtdIn','mtdOut'].map(f => `<td class="num">${fmt(name === '합계' ? sum(f) : d.accts[name][f])}</td>`).join('') + '</tr>';
  $('report').innerHTML = `<thead><tr><th>계좌</th><th>전일 잔액</th><th>입금</th><th>출금</th><th>금일 잔액</th><th>월누계 입금</th><th>월누계 출금</th></tr></thead><tbody>` +
    A.map(a => row(a)).join('') + row('합계') + '</tbody>';

  $('real').innerHTML = `<thead><tr><th>구분</th><th>계좌 합계</th><th>계좌간이체</th><th>실제 금액</th></tr></thead><tbody>
    <tr><td>입금</td><td class="num">${fmt(d.realIn + d.xfer)}</td><td class="num">${fmt(d.xfer)}</td><td class="num"><b>${fmt(d.realIn)}</b></td></tr>
    <tr><td>출금</td><td class="num">${fmt(d.realOut + d.xfer)}</td><td class="num">${fmt(d.xfer)}</td><td class="num"><b>${fmt(d.realOut)}</b></td></tr></tbody>`;
  const xs = D.transfers.filter(p => p.date === d.date);
  $('xferList').innerHTML = xs.length
    ? '계좌간이체: ' + xs.map(p => `${esc(p.fromAcct)} → ${esc(p.toAcct)} <b>${fmt(p.amount)}원</b>`).join(', ')
    : '이 날 계좌간이체 없음';

  const rows = D.txns.filter(t => t.date === d.date);
  $('txnDate').textContent = `· ${label(d.date)} · ${rows.length}건`;
  $('txns').innerHTML = rows.length
    ? `<thead><tr><th>계좌</th><th>시각</th><th>구분</th><th class="l">거래처·내용</th><th>입금</th><th>출금</th><th>계좌간이체</th></tr></thead><tbody>` +
      rows.map(t => `<tr><td class="l">${esc(t.acct)}</td><td class="num">${t.time.slice(0,5)}</td><td>${esc(t.type)}</td><td class="l">${esc(t.desc)}</td>
        <td class="num">${t.inn ? fmt(t.inn) : ''}</td><td class="num">${t.out ? fmt(t.out) : ''}</td><td>${t.xfer ? '<span class="tag">예 · 이체</span>' : ''}</td></tr>`).join('') + '</tbody>'
    : '<tbody><tr><td class="empty">거래 없음</td></tr></tbody>';
}

/* ───── 차트 공통 ───── */
function frame(el, W, H, m) { return { W, H, m, iw: W - m.l - m.r, ih: H - m.t - m.b }; }
function tooltip(el, html, x, y, W) {
  let t = el.querySelector('.tip');
  if (!t) { t = document.createElement('div'); t.className = 'tip'; el.appendChild(t); }
  if (html == null) { t.style.opacity = 0; return; }
  t.innerHTML = html; t.style.opacity = 1;
  const w = t.offsetWidth;
  t.style.left = Math.max(0, Math.min(el.clientWidth - w, x - w / 2)) + 'px';
  t.style.top = Math.max(0, y - t.offsetHeight - 12) + 'px';
}
const WIN = 22;   // 차트에 보이는 최근 거래일 수 (월이 바뀌어도 이어서 보임)
const monthDays = () => { const s = Math.max(0, Math.min(cur, D.days.length - WIN)); return D.days.map((d, i) => ({ d, i })).slice(s, s + WIN); };

/* ───── 합계 잔액 추이 (이 달) ───── */
function renderBal() {
  const el = $('balChart'), pts = monthDays();
  const W = Math.max(280, el.clientWidth), H = 220, f = frame(el, W, H, { l: 44, r: 12, t: 10, b: 26 });
  const vals = pts.map(p => p.d.totalClose);
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 4), lo = ticks[0], hi = ticks[ticks.length - 1];
  const X = k => f.m.l + (pts.length === 1 ? f.iw / 2 : f.iw * k / (pts.length - 1));
  const Y = v => f.m.t + f.ih * (1 - (v - lo) / (hi - lo || 1));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 거래일별 합계 잔액 추이">`;
  ticks.forEach(t => s += `<line x1="${f.m.l}" x2="${W - f.m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)"/><text x="${f.m.l - 6}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtM(t)}</text>`);
  const step = Math.ceil(pts.length / 6);
  pts.forEach((p, k) => { if (k % step === 0 || k === pts.length - 1) s += `<text x="${X(k)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${short(p.d.date)}</text>`; });
  s += `<path d="${pts.map((p, k) => (k ? 'L' : 'M') + X(k) + ' ' + Y(p.d.totalClose)).join('')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
  const sk = pts.findIndex(p => p.i === cur);
  if (sk >= 0) s += `<circle cx="${X(sk)}" cy="${Y(pts[sk].d.totalClose)}" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
     <text x="${X(sk)}" y="${Y(pts[sk].d.totalClose) - 10}" text-anchor="${sk > pts.length / 2 ? 'end' : 'start'}" font-size="11" fill="var(--ink)">${fmtM(pts[sk].d.totalClose)}</text>`;
  s += `<line id="bx" y1="${f.m.t}" y2="${f.m.t + f.ih}" stroke="var(--axis)" opacity="0"/><rect x="${f.m.l}" y="0" width="${f.iw}" height="${H}" fill="transparent" id="bhit" style="cursor:pointer"/></svg>`;
  el.innerHTML = s;
  const hit = el.querySelector('#bhit'), bx = el.querySelector('#bx');
  const idx = e => { const r = hit.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * f.iw; return Math.max(0, Math.min(pts.length - 1, Math.round(x / f.iw * (pts.length - 1)))); };
  hit.addEventListener('mousemove', e => {
    const k = idx(e), d = pts[k].d; bx.setAttribute('x1', X(k)); bx.setAttribute('x2', X(k)); bx.setAttribute('opacity', 1);
    tooltip(el, `<b>${label(d.date)}</b>` + D.accounts.map(a => `<div><span class="k">${esc(a)}</span><span>${fmt(d.accts[a].close)}</span></div>`).join('') + `<div><span class="k">합계</span><b style="margin:0">${fmt(d.totalClose)}</b></div>`, X(k), Y(d.totalClose), W);
  });
  hit.addEventListener('mouseleave', () => { bx.setAttribute('opacity', 0); tooltip(el, null); });
  hit.addEventListener('click', e => go(pts[idx(e)].i));
}

/* ───── 일별 실제 입금·출금 (이 달) ───── */
function renderFlow() {
  const el = $('flowChart'), pts = monthDays();
  const W = Math.max(300, el.clientWidth), H = 250, f = frame(el, W, H, { l: 44, r: 12, t: 10, b: 26 });
  const ticks = niceTicks(0, Math.max(...pts.map(p => Math.max(p.d.realIn, p.d.realOut)), 1), 4), hi = ticks[ticks.length - 1];
  const Y = v => f.m.t + f.ih * (1 - v / hi), slot = f.iw / pts.length, bw = Math.max(3, Math.min(18, slot * .36));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 실제 입금과 출금">`;
  ticks.forEach(t => s += `<line x1="${f.m.l}" x2="${W - f.m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t === 0 ? 'var(--axis)' : 'var(--grid)'}"/><text x="${f.m.l - 6}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtM(t)}</text>`);
  const bar = (x, v, c) => { if (!v) return ''; const y = Y(v), h = Y(0) - y, r = Math.min(4, bw / 2, h);
    return `<path d="M${x} ${Y(0)}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + bw - r}Q${x + bw} ${y} ${x + bw} ${y + r}V${Y(0)}Z" fill="${c}"/>`; };
  const step = Math.ceil(pts.length / 10);
  pts.forEach((p, k) => {
    const cx = f.m.l + slot * (k + .5), sel = p.i === cur;
    if (sel) s += `<rect x="${cx - slot / 2}" y="${f.m.t}" width="${slot}" height="${f.ih}" fill="var(--chip)"/>`;
    s += bar(cx - bw - 1, p.d.realIn, 'var(--s1)') + bar(cx + 1, p.d.realOut, 'var(--s2)');
    if (k % step === 0 || sel) s += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="11" fill="${sel ? 'var(--ink)' : 'var(--muted)'}" ${sel ? 'font-weight="700"' : ''}>${short(p.d.date)}</text>`;
  });
  s += `<rect x="${f.m.l}" y="0" width="${f.iw}" height="${H}" fill="transparent" id="fhit" style="cursor:pointer"/></svg>`;
  el.innerHTML = s;
  const hit = el.querySelector('#fhit');
  const idx = e => { const r = hit.getBoundingClientRect(); return Math.max(0, Math.min(pts.length - 1, Math.floor((e.clientX - r.left) / r.width * pts.length))); };
  hit.addEventListener('mousemove', e => {
    const k = idx(e), d = pts[k].d;
    tooltip(el, `<b>${label(d.date)}</b><div><span class="k"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s1);margin-right:5px"></i>실제 입금</span><span>${fmt(d.realIn)}</span></div>
      <div><span class="k"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s2);margin-right:5px"></i>실제 출금</span><span>${fmt(d.realOut)}</span></div>` +
      (d.xfer ? `<div><span class="k">계좌간이체(제외)</span><span>${fmt(d.xfer)}</span></div>` : ''), f.m.l + slot * (k + .5), Y(Math.max(d.realIn, d.realOut)), W);
  });
  hit.addEventListener('mouseleave', () => tooltip(el, null));
  hit.addEventListener('click', e => go(pts[idx(e)].i));
}

function go(i) { cur = Math.max(0, Math.min(D.days.length - 1, i)); render(); }
function render() {
  renderHead(); renderKpis(); renderTables(); renderBal(); renderFlow();
  $('foot').textContent = `원본 파일 ${D.files.length}개: ${D.files.join(', ')}` + (D.dupDropped ? ` · 중복 거래 ${D.dupDropped}건 제외` : '');
}
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
$('latest').onclick = () => go(D.days.length - 1);
$('dateSel').onchange = e => go(+e.target.value);
document.addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.key === 'ArrowLeft') go(cur - 1); if (e.key === 'ArrowRight') go(cur + 1); });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { renderBal(); renderFlow(); }, 80); });
/* 열어본 날 기준 직전 영업일 거래가 데이터에 없으면 경고 (공휴일은 걸러주지 않음) */
function renderStale() {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  do { t.setDate(t.getDate() - 1); } while (t.getDay() === 0 || t.getDay() === 6);
  const want = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
  const el = $('stale');
  el.hidden = D.asOf >= want;
  if (!el.hidden) el.innerHTML = `<b>⚠ 최신 거래내역 확인 필요</b> · 데이터는 ${label(D.asOf)}까지입니다. 직전 영업일 ${label(want)} 거래내역 파일이 아직 안 들어왔을 수 있습니다 (공휴일이면 무시).`;
}
renderChecks(); renderStale(); render();
</script>
</body>
